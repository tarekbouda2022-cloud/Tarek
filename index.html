
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            background: #17243a;
            padding: 25px;
        }

        h1 {
            color: #38bdf8;
        }

        .container {
            padding: 50px 20px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #17243a;
        }
    </style>
</head>

<body>

    <header>
        <h1>مرحبا بك في موقعي</h1>
        <p>هذا هو أول موقع إلكتروني خاص بي</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>من أنا؟</h2>
            <p>أهلا وسهلا بك في موقعي الشخصي.</p>

            <h2>ماذا أقدم؟</h2>
            <p>أعمل على تطوير مشاريعي وأفكاري عبر الإنترنت.</p>

            <button onclick="alert('شكرا لزيارتك موقعي!')">
                اضغط هنا
            </button>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026
    </footer>

</body>
</html>
